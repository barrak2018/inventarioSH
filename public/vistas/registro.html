<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuarios | Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Registrar Nuevo Usuario</h2>
        
        <form id="registro-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="md:col-span-1">
                <label class="block text-sm font-semibold text-gray-700">Cédula</label>
                <input type="text" id="reg-cedula" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div class="md:col-span-1">
                <label class="block text-sm font-semibold text-gray-700">Código de Empleado</label>
                <input type="text" id="reg-codigo" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-gray-700">Nombre Completo</label>
                <input type="text" id="reg-nombre" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700">Cargo</label>
                <input type="text" id="reg-cargo" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700">Empresa</label>
                <input type="text" id="reg-empresa" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700">Contraseña de Acceso</label>
                <input type="password" id="reg-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700">Rol de Sistema</label>
                <select id="reg-rol" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                    <option value="visor">Visor (Solo lectura)</option>
                    <option value="operador">Operador (Escritura)</option>
                    <option value="admin">Administrador (Todo)</option>
                </select>
            </div>

            <div class="md:col-span-2 pt-4">
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition-all">
                    Crear Cuenta de Usuario
                </button>
            </div>
        </form>
        <div id="registro-msg" class="mt-4 p-3 rounded hidden text-center"></div>
    </div>
    <script type="module" src="../js/registro.js"></script>
</body>
</html>
