<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | Control System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/stile.css">
    <script src="../js/tailwind.js"></script>
</head>
<body class="font-inter bg-gray-50 min-h-screen">
    <div class="flex h-screen">
        <aside class="w-64 bg-dark text-white flex flex-col">
            <div class="p-6 border-b border-gray-700">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
                        <i class="fas fa-boxes text-white text-xl"></i>
                    </div>
                    <h1 class="text-xl font-bold">InventorySH</h1>
                </div>
                <p class="text-gray-400 text-sm mt-2">v2.4.1</p>
            </div>

            <nav class="flex-1 p-4">
                <ul id="nav-menu" class="space-y-2"></ul>
            </nav>

            <div class="p-6 border-t border-gray-700">
                <div class="flex items-center space-x-3">
                    <img src="https://picsum.photos/40?random=100" alt="User profile" class="w-10 h-10 rounded-full">
                    <div>
                        <p class="font-medium">Manager</p>
                        <p class="text-gray-400 text-sm">Admin</p>
                    </div>
                </div>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white border-b border-gray-200">
                <div class="px-6 py-4 flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold text-dark" id="page-title">Gestion de Inventario</h2>
                        <p class="text-gray-600 text-sm" id="page-subtitle">Overview of your inventory</p>
                    </div>
                </div>
            </header>

            <!-- div donde insertar el contenido -->
            <section class="px-6 py-8">
                

            </section>
        </div>
    </div>
    
    <script src="../js/script.js"></script>
</body>
</html>
